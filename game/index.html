<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Island Hopper — a bush-plane run across the tropics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <canvas id="game" width="1280" height="720" aria-label="Island Hopper flight game"></canvas>

</main>
